<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamilyConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-out { transition: opacity 1.5s ease-out; opacity: 0 !important; }
        .message-bubble { transition: all 0.3s ease; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: #17212b; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-950 text-white h-screen flex items-center justify-center m-0 overflow-hidden font-sans">

    <!-- Экран входа -->
    <div id="loginScreen" class="w-full max-w-sm bg-[#17212b] p-8 rounded-2xl shadow-2xl text-center z-50">
        <h1 class="text-3xl font-bold mb-2 text-white">FamilyConnect</h1>
        <input type="text" id="nameInput" placeholder="Ваше имя..." class="w-full p-4 mb-3 rounded-xl bg-[#242f3d] border-none text-white focus:outline-none">
        <input type="password" id="passInput" placeholder="Пароль..." class="w-full p-4 mb-4 rounded-xl bg-[#242f3d] border-none text-white focus:outline-none">
        <button id="loginBtn" class="w-full py-4 bg-[#5288c1] rounded-xl font-bold text-lg">Войти</button>
    </div>

    <!-- Основной чат -->
    <div id="chatContainer" class="hidden w-full h-full max-w-md bg-[#0e1621] flex flex-col relative shadow-2xl sm:h-[90vh] sm:rounded-3xl overflow-hidden border border-gray-800">
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 pb-20"></div>
        <div class="bg-[#17212b] p-2 flex items-end gap-2 z-30">
            <textarea id="msgInput" rows="1" placeholder="Сообщение..." class="flex-1 p-3 rounded-xl bg-[#242f3d] focus:outline-none text-white resize-none"></textarea>
            <button id="sendBtn" class="p-4 bg-[#5288c1] rounded-full text-white">✉️</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZ82pn4M8CX_2ySPBXjDBscfZVpS7mo_o",
            databaseURL: "https://familyconnect-f3026-default-rtdb.firebaseio.com",
            projectId: "familyconnect-f3026",
            storageBucket: "familyconnect-f3026.firebasestorage.app",
            appId: "1:586629397170:web:2560475f7b9c1315fda7ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        let myName = localStorage.getItem('myName');
        const myId = localStorage.getItem('myChatId') || Math.random().toString(36).substring(2, 10);
        localStorage.setItem('myChatId', myId);

        document.getElementById('loginBtn').onclick = () => {
            const name = document.getElementById('nameInput').value;
            const pass = document.getElementById('passInput').value;
            if (pass === "pipiki" && name.trim() !== "") {
                localStorage.setItem('myName', name);
                myName = name;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('chatContainer').classList.remove('hidden');
                if (Notification.permission !== "granted") Notification.requestPermission();
            } else {
                alert("Введите имя и правильный пароль");
            }
        };

        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            if (input.value.trim() !== "") {
                push(messagesRef, { text: input.value, sender: myName, id: myId, time: Date.now() });
                input.value = "";
            }
        };

        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const isMe = msg.id === myId;
            const msgsDiv = document.getElementById('messages');
            
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} message-bubble`;
            div.innerHTML = `
                <span class="text-[10px] text-gray-500 mb-1">${msg.sender}</span>
                <div class="p-3 ${isMe ? 'bg-[#2b5278]' : 'bg-[#182533]'} rounded-2xl max-w-[80%]">${msg.text}</div>
            `;
            msgsDiv.appendChild(div);
            msgsDiv.scrollTop = msgsDiv.scrollHeight;

            if (!isMe && document.hidden) {
                new Notification("Новое сообщение от " + msg.sender, { body: msg.text });
            }

            setTimeout(() => { div.classList.add('fade-out'); setTimeout(() => div.remove(), 1500); }, 60000);
        });
    </script>
</body>
</html>
